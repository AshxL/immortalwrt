name: Build My Forked ImmortalWrt (mwan3)

on:
  workflow_dispatch: # 手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 直接拉取你 Fork 且已经修改好 DTS 的当前仓库
      - name: Checkout Forked Repository
        uses: actions/checkout@v4

      # 2. 清理磁盘空间并安装编译依赖环境
      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget ccache

      # 3. 设置 ccache 缓存编译器大小上限（4GB以防超出 Actions 限制）
      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 4.0G" > ~/.ccache/ccache.conf

      # 4. 关键：构建缓存（缓存下载的软件包源码 dl 和 C++ 编译文件）
      - name: Cache Build Environment
        uses: actions/cache@v5.1.0
        with:
          path: |
            dl
            ~/.ccache
          key: openwrt-cache-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openwrt-cache-${{ runner.os }}-

      # 5. 更新并安装依赖扩展包
      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 6. 生成极简纯净的 .config 配置文件（已增加 mwan3）
      - name: Generate Minimal Clean .config
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4a-100m=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_luci=y

          # ========== MWAN3 多WAN负载均衡插件 ==========
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-i18n-mwan3-zh-cn=y
          EOF
          
          # 根据上述最简配置，自动补齐内核和固件所必需的底层组件
          make defconfig

      # 7. 下载编译所需的外部依赖包
      - name: Download Packages
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 8. 编译固件（包含你的 DTS 修改）
      - name: Compile Firmware
        run: |
          echo "正在使用你修改好的 DTS 配置进行编译..."
          make -j$(nproc) || make -j1 V=s

      # 9. 上传生成的固件
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: immortalwrt-mir4a-100m-sysupgrade
          path: bin/targets/ramips/mt76x8/*sysupgrade.bin
          retention-days: 7
